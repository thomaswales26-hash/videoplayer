name: Build macOS app

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build universal app
        run: ./build.sh

      - name: Verify universal architectures
        run: |
          lipo -archs "build/artifacts/Northstar Video Player.app/Contents/MacOS/UniversalVideoPlayer" \
            | grep -Eq 'arm64.*x86_64|x86_64.*arm64'
          codesign --verify --deep --strict "build/artifacts/Northstar Video Player.app"

      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/artifacts/Northstar Video Player.app" \
            "build/Northstar-Video-Player-macOS-universal.zip"
          pkgutil --payload-files "build/Northstar-Video-Player-macOS-universal.pkg" \
            | grep -q 'Northstar Video Player.app/Contents/MacOS/UniversalVideoPlayer'
          hdiutil verify "build/Northstar-Video-Player-macOS-universal.dmg"

      - name: Upload app, installer, and disk image
        uses: actions/upload-artifact@v4
        with:
          name: Northstar-Video-Player-macOS-universal
          path: |
            build/Northstar-Video-Player-macOS-universal.zip
            build/Northstar-Video-Player-macOS-universal.pkg
            build/Northstar-Video-Player-macOS-universal.dmg
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: Northstar-Video-Player-macOS-universal
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/Northstar-Video-Player-macOS-universal.zip" \
            "release/Northstar-Video-Player-macOS-universal.pkg" \
            "release/Northstar-Video-Player-macOS-universal.dmg" \
            --title "Northstar Video Player $GITHUB_REF_NAME" \
            --generate-notes
